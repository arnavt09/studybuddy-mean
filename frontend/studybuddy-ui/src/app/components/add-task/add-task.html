<h2>Add New Study Task</h2>
<form class="task-form" (ngSubmit)="addTask()">
  <label>Title</label>
  <input type="text" name="title" [(ngModel)]="task.title" required />
  <label>Subject</label>
  <input type="text" name="subject" [(ngModel)]="task.subject" required />
  <label>Description</label>
  <textarea name="description" [(ngModel)]="task.description"></textarea>
  <label>Priority</label>
  <select name="priority" [(ngModel)]="task.priority">
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
  </select>
  <label>Status</label>
  <select name="status" [(ngModel)]="task.status">
    <option value="Pending">Pending</option>
    <option value="Completed">Completed</option>
  </select>
  <button type="submit">Save Task</button>
</form>
